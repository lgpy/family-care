[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
androidx-activityCompose = "1.13.0"
androidx-coreKtx = "1.18.0"
androidx-credentials = "1.6.0"
androidx-lifecycle = "2.10.0"
androidx-navigationCompose = "2.9.8"
googleid = "1.2.1"
koin = "4.2.2"
ktor = "3.5.1"
supabase = "3.8.0"
# Newest PowerSync release whose AARs still accept compileSdk 36: 1.15.0 and
# later declare minCompileSdk=37 (the build's compileSdk is fixed at 36).
powersync = "1.14.1"
# Push (M4, D4/D27). The BoM keeps firebase-messaging on a tested release; only
# FCM is pulled in — no analytics, crash reporting or other Firebase services
# (D17). The google-services plugin reads android/app/google-services.json,
# whose values are public Firebase identifiers (D21/D27).
firebaseBom = "34.19.0"
googleServices = "4.4.4"
# WorkManager retries token registration while offline and runs the short clear
# job when a data-only push arrives with the app in the background (M4).
androidx-work = "2.10.5"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
junit4 = "4.13.2"
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"
turbine = "1.2.1"

[libraries]
# Plugins consumed by the included build-logic build only.
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# AndroidX / Compose
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
# ViewModel + viewModelScope for the feature modules' screen view models.
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigationCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# The small built-in icon set (Home, Person, Add, Share, …) for the bottom bar
# and the patient FAB. Version comes from the Compose BOM.
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# Sign in with Google (D12): Credential Manager returns a Google ID token that
# Supabase Auth verifies server-side.
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# Firebase Cloud Messaging only (D4/D27): escalation and clear pushes. The BoM
# pins the release; no analytics or other Firebase product is a dependency.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

# Supabase client (build-plan: "PowerSync + Supabase setup"). The BOM keeps
# auth/postgrest on the same release; PowerSync itself arrives in a later task.
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
# The `android` engine (HttpURLConnection) rather than OkHttp: Ktor 3.6.0's
# OkHttp engine pulls okhttp-android 5.5.0, which requires compileSdk 37.
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
# JVM engine and core used by the data layer's JVM integration tests only: the
# app itself always ships the Android engine above.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# PowerSync Kotlin SDK (M1 sync). `:common` instead of `:core` is what the
# encryption guide requires: `:core` bundles a SQLite driver and a Ktor engine,
# while `:common` lets the app supply the encrypted driver
# (`com.powersync:sqlite3multipleciphers`) and reuse ktor-client-android.
# 1.14.1 is built against Kotlin 2.3 and requires Ktor 3.5.0, so the existing
# Ktor 3.5.1 resolves it without change.
powersync-common = { module = "com.powersync:common", version.ref = "powersync" }
powersync-sqlite3multipleciphers = { module = "com.powersync:sqlite3multipleciphers", version.ref = "powersync" }

# Dependency injection
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

# Tests
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Shared test vectors (shared/test-vectors) are JSON; the medications domain
# tests parse them with the JSON reader only (no compiler plugin).
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Generates the Firebase resources from android/app/google-services.json (M4 push).
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
