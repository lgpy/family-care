# gitleaks baseline configuration (build-plan M1: secret protection).
#
# Extends the default rule set; rules are never weakened, only scoped.
# Run (gitleaks 8.19+): gitleaks git . --config .gitleaks.toml --redact --verbose
# Staged changes only (what the pre-commit hook does): add --staged

title = "Family Care"

[extend]
# Keep the built-in rules and their defaults.
useDefault = true

[[allowlists]]
description = "Build output and caches are never committed; placeholder credentials are allowed by pattern only."

# docs/ and ops/ are scanned like everything else: ops/backup is where the age
# identity, the database URL and the B2 key are handled during a restore.
paths = [
  # Build output and tooling caches.
  '''(^|/)build/''',
  '''(^|/)\.gradle/''',
  '''(^|/)\.git/''',
]

regexes = [
  '''(?i)example[_-]?(api[_-]?key|secret|token)''',
  '''(?i)YOUR[_-]?(API[_-]?KEY|SECRET|TOKEN)''',
  # Public build-time identifiers (build-plan M1): android/environments holds the
  # Supabase URL, publishable key, Google Web client id and PowerSync URL. The
  # Supabase *publishable* key is a public identifier by design — it ships in the
  # APK and grants only what Row-Level Security allows — so generic-api-key
  # always matches it. Allowed by its published prefix/shortest form only, so
  # any other credential in that file is still reported; the file must never
  # hold a secret (no service-role key, keystore password or private key).
  '''^sb_publishable_[A-Za-z0-9_-]{20,}$''',
]

# One file, one allowance (M4): android/app/google-services.json carries the
# Firebase project id, the Android app id and the "current_key" Android API key.
# That key is a public Firebase identifier — it is compiled into every APK — and
# the file is committed on purpose so CI can build the FCM client (D21/D27).
# Scoped to this exact path and nothing else: every other file, including any
# other copy of google-services.json, is still scanned by the full rule set.
[[allowlists]]
description = "Committed Firebase Android config: public identifiers only, no secret."
paths = [
  '''^android/app/google-services\.json$''',
]
