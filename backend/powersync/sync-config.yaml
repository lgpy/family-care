# PowerSync sync configuration (what each phone is allowed to download).
#
# Format: Sync Streams (config edition 3). This is the format the PowerSync docs
# recommend for new projects; the older `bucket_definitions` Sync Rules are the
# legacy format (docs.powersync.com/sync/rules/overview). See README.md.
#
# Deployed by pasting this file into the PowerSync dashboard (Sync Streams ->
# edit YAML -> Deploy). It is deliberately not applied by the Supabase CLI.
#
# Reads are filtered here; writes are filtered by RLS in
# backend/supabase/migrations/. Both are tested against the same scenario
# (security-and-privacy §3, D13).
#
# Every `query:` must stay on ONE line: `backend/powersync/check-sync-tests.sh`
# extracts them and requires each one (with auth.user_id() replaced by
# (select auth.uid())) to appear verbatim in
# backend/supabase/tests/core_care_circle_test.sql. Editing a stream without
# editing its test fails CI.

config:
  edition: 3

streams:
  # M2 care circle: everything in the circles the user belongs to. The access
  # rule is `core.memberships` itself, mirroring core.circle_role()/core.can()
  # in the database. Subquery form (`IN (SELECT ...)`) as documented for Sync
  # Streams queries; see README.md.
  care_circles:
    auto_subscribe: true
    query: SELECT * FROM "core"."care_circles" WHERE id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id())

  # All memberships of those circles, so the app can show the family list.
  memberships:
    auto_subscribe: true
    query: SELECT * FROM "core"."memberships" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id())

  # Names/languages of co-members. A removed member stops matching the inner
  # subquery immediately, so their profile leaves the phone on the next sync.
  profiles:
    auto_subscribe: true
    query: SELECT * FROM "core"."profiles" WHERE id IN (SELECT user_id FROM "core"."memberships" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id()))

  # Every patient in the circle, for every role (viewers included).
  patients:
    auto_subscribe: true
    query: SELECT * FROM "core"."patients" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id())

  # M3 medications: the medication rows of every patient in the user's circles.
  # One line per stream (check-sync-tests.sh); the nested IN subqueries walk
  # medications -> core.patients -> core.memberships, the same access path as
  # core.can() in the database.
  medications:
    auto_subscribe: true
    query: SELECT * FROM "meds"."medications" WHERE patient_id IN (SELECT id FROM "core"."patients" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id()))

  # Regimens of those medications. A regimen row is immutable apart from
  # end_date, so a dose change arrives as an insert plus an end_date update.
  regimens:
    auto_subscribe: true
    query: SELECT * FROM "meds"."regimens" WHERE medication_id IN (SELECT id FROM "meds"."medications" WHERE patient_id IN (SELECT id FROM "core"."patients" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id())))

  # The dose log of those medications. Synced without a time window for now: a
  # future milestone should add `AND scheduled_local > ...` (a few months) so a
  # long-lived circle does not download its whole history. The append-only table
  # keeps growing, so the window is the only thing that bounds this stream.
  dose_log:
    auto_subscribe: true
    query: SELECT * FROM "meds"."dose_log" WHERE medication_id IN (SELECT id FROM "meds"."medications" WHERE patient_id IN (SELECT id FROM "core"."patients" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id())))

  # The stock ledger of those medications (M5, D28). Counts, refills and
  # discards sync so every phone derives the same current stock locally; the
  # doses that also deduct from it are already in the dose_log stream. Same
  # access path as dose_log: medications -> patients -> memberships.
  stock_movements:
    auto_subscribe: true
    query: SELECT * FROM "meds"."stock_movements" WHERE medication_id IN (SELECT id FROM "meds"."medications" WHERE patient_id IN (SELECT id FROM "core"."patients" WHERE circle_id IN (SELECT circle_id FROM "core"."memberships" WHERE user_id = auth.user_id())))

  # Deliberately NOT synced: core.invitations (bearer codes / emails stay on the
  # server), core.patient_access_overrides (not used in the MVP),
  # core.audit_log (server-side, owner-only Activity screen), the push tables
  # (core.push_devices, meds.escalations, meds.stock_alerts: server state, no
  # API privilege).
