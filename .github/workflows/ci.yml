name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The runner images ship the SDK, but pin the exact build tools/platform
      # this build declares (compileSdk 36, build-tools 36.0.0). `sdkmanager`
      # is not always on PATH, so fall back to the SDK's cmdline-tools install
      # instead of silently skipping this step.
      - name: Install Android SDK packages
        run: |
          sdkmanager_bin=""
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          else
            for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
              candidate="$root/cmdline-tools/latest/bin/sdkmanager"
              if [ -n "$root" ] && [ -x "$candidate" ]; then
                sdkmanager_bin="$candidate"
                break
              fi
            done
          fi

          if [ -z "$sdkmanager_bin" ]; then
            echo "::warning::sdkmanager not found; relying on the runner's preinstalled Android SDK"
            exit 0
          fi

          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"

      # checkModuleBoundaries runs as part of `check`, which `build` depends on.
      - name: Build, lint and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action uses the repository GITLEAKS_LICENSE only for
      # organisations; personal repositories run on the free CLI path.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    name: Database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the local Postgres container and applies every migration in
      # supabase/migrations/. No remote project is linked: nothing here can
      # touch dev or prod.
      - name: Start local database
        run: supabase db start

      # Sync Streams are the read half of access control (D13). This fails when a
      # stream query in powersync/sync-config.yaml is not executed verbatim by
      # the pgTAP tests, i.e. when the YAML and the tests drift apart.
      - name: Check sync-stream tests cover sync-config.yaml
        run: bash powersync/check-sync-tests.sh

      # pgTAP isolation tests (build-plan §4): branch isolation per role, the
      # mirrored Sync Streams queries, invitations, audit and append-only, RLS
      # on every core table, publication present.
      - name: Run database tests
        run: supabase test db

      - name: Lint database
        run: supabase db lint --level error --fail-on error

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/supabase/functions
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The guard of D22: the TypeScript dose-slot and dose-status port is
      # asserted against the same shared/test-vectors files as the Kotlin app,
      # plus the pure escalation selection and the FCM sender (mocked fetch,
      # no Firebase project). Reading ../../../../shared is why --allow-read is
      # granted; nothing else is.
      - name: Run edge-function unit tests and shared vectors
        run: deno test --allow-read

      # The three deployable functions are not imported by the tests, so check
      # them explicitly (the supabase-js import is fetched by Deno).
      - name: Type-check the edge functions
        run: deno check escalate/index.ts dose-confirmed/index.ts stock-low/index.ts

  uploads:
    name: Local upload integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Only what the upload path needs: Postgres, the API gateway (Kong),
      # GoTrue and PostgREST. Studio, storage, realtime, mail, analytics, the
      # pooler and the metadata API are not involved. Local only, no link.
      - name: Start the local Supabase API
        working-directory: backend
        # One line on purpose: the exclude list is a single comma-separated value.
        run: supabase start -x studio,imgproxy,storage-api,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      # The JVM upload tests read these two variables and skip themselves when
      # they are absent — which is why the plain `build` job stays offline.
      - name: Export the local stack for the tests
        working-directory: backend
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=')"
          # Fail here rather than let every upload test skip and pass silently.
          test -n "$API_URL" && test -n "${PUBLISHABLE_KEY:-$ANON_KEY}"
          {
            echo "FAMILYCARE_SUPABASE_URL=$API_URL"
            echo "FAMILYCARE_SUPABASE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
          } >> "$GITHUB_ENV"

      # Real PostgREST uploads against the local stack, signed in as real test
      # users: the new-patient insert, the edit, the duplicate fallback, and the
      # policy refusal the queue must report as permanent — plus the same path
      # for the medications module's `meds` tables (versioned regimens, the
      # append-only dose log, a viewer's refusal).
      - name: Run the JVM upload tests
        run: ./gradlew :core:data:jvmtests:test :feature:medications:data:jvmtests:test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-test-reports
          path: |
            android/core/data/jvmtests/build/reports/tests/
            android/feature/medications/data/jvmtests/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the local Supabase API
        if: always()
        working-directory: backend
        run: supabase stop --no-backup

